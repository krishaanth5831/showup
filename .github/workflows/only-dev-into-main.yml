name: only-dev-into-main

# main only takes pull requests that come from dev.
on:
  pull_request:
    branches: [main]

jobs:
  only-dev-into-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Pull requests into main must come from dev (this one comes from $HEAD_REF)."
            exit 1
          fi
          echo "Source branch is dev."
